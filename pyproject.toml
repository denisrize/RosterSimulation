[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roster-simulation"
version = "0.1.0"
description = "Roster simulation engine and recommendation analysis"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0,<2.0.0",  # NumPy 2.x has breaking changes
    "pandas>=1.3.0",
    "tqdm>=4.62.0",
    "xgboost>=1.5.0",
    "trueSkill"
]

[project.scripts]
roster-sim = "simulation_pkg.cli:main"

[tool.setuptools.packages.find]
where = ["simulation_pkg"]
