[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roster-advisor"
version = "0.1.0"
description = "Cycling team roster recommendation engine using ML-based simulation"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0,<2.0.0",  # NumPy 2.x has breaking changes
    "pandas>=1.3.0",
    "tqdm>=4.62.0",
    "xgboost>=1.5.0",
    "trueSkill"
]

[project.scripts]
roster-advisor = "roster_advisor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["roster_advisor*"]
